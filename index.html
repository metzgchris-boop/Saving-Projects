// ── Group Status Logic ───────────────────────────────────────
const STATUS_ORDER = ['idea', 'open', 'in_progress', 'completed'];
function groupStatus(members) {
  if (!members.length) return 'open';
  const statuses = members.map(p => p.status).filter(s => s !== 'deleted');
  if (!statuses.length) return 'open';
  if (statuses.every(s => s === 'completed')) return 'completed';
  // most advanced excluding completed
  const nonCompleted = statuses.filter(s => s !== 'completed');
  if (!nonCompleted.length) return 'completed';
  return [...nonCompleted].sort((a,b) => STATUS_ORDER.indexOf(b) - STATUS_ORDER.indexOf(a))[0];
}
function groupField(members, key) {
  const vals = [...new Set(members.map(p => p[key]).filter(Boolean))];
  if (!vals.length) return '';
  if (vals.length === 1) return vals[0];
  return 'Several';
}

// ── Group Modal ───────────────────────────────────────────────
function GroupModal({ group, groups, projects, onSave, onClose, tweaks, nextNum }) {
  const isNew = !group?.id;
  const [name,       setName]       = useState(group?.name || '');
  const [owner,      setOwner]      = useState(group?.owner || '');
  const [selected,   setSelected]   = useState(group?.projectIds || []);
  const [q,          setQ]          = useState('');
  const [fCom,       setFCom]       = useState('all');
  const [fOwnerF,    setFOwnerF]    = useState('all');
  const [fBU,        setFBU]        = useState('all');
  const [err,        setErr]        = useState('');

  // projects not deleted and not already in another group
  const groupedIds = new Set(groups.filter(g => g.id !== group?.id).flatMap(g => g.projectIds));
  const available = projects.filter(p => p.status !== 'deleted' && !groupedIds.has(p.id));

  const owners     = [...new Set(available.map(p=>p.owner).filter(Boolean))].sort();
  const commodities = [...new Set(available.map(p=>p.category).filter(Boolean))].sort();
  const bus        = [...new Set(available.map(p=>p.businessUnit).filter(Boolean))].sort();

  const filtered = available.filter(p => {
    if (q && !`${p.title} ${p.number} ${p.owner} ${p.category} ${p.businessUnit||''}`.toLowerCase().includes(q.toLowerCase())) return false;
    if (fCom    !== 'all' && p.category !== fCom) return false;
    if (fOwnerF !== 'all' && p.owner !== fOwnerF) return false;
    if (fBU     !== 'all' && (p.businessUnit||'') !== fBU) return false;
    return true;
  });

  const toggle = id => setSelected(s => s.includes(id) ? s.filter(x=>x!==id) : [...s, id]);

  const save = () => {
    if (!name.trim()) { setErr('Group name is required.'); return; }
    if (!owner.trim()) { setErr('Owner is required.'); return; }
    onSave({ id: group?.id || genId(), number: group?.number || nextNum(), name: name.trim(), owner: owner.trim(), projectIds: selected });
  };

  const iStyle = { padding:'8px 11px', border:'1px solid #E8EBF0', borderRadius:9, fontSize:13, outline:'none', fontFamily:'inherit', width:'100%', color:'#111827' };
  const lStyle = { fontSize:10, fontWeight:700, color:'#9CA3AF', textTransform:'uppercase', letterSpacing:'0.08em', marginBottom:5, display:'block' };
  const selSt  = { padding:'6px 9px', border:'1px solid #E8EBF0', borderRadius:8, fontSize:12, color:'#374151', outline:'none', background:'#fff', height:32 };

  return (
    <div style={{ position:'fixed', inset:0, background:'rgba(15,20,35,0.45)', display:'flex', alignItems:'center', justifyContent:'center', zIndex:100, backdropFilter:'blur(6px)' }} onClick={onClose}>
      <div style={{ background:'#fff', borderRadius:18, width:860, height:'82vh', display:'flex', flexDirection:'column', boxShadow:'0 24px 70px rgba(0,0,0,0.22)' }} onClick={e=>e.stopPropagation()}>
        {/* Header */}
        <div style={{ padding:'28px 32px 20px', borderBottom:'1px solid #F3F4F6', flexShrink:0 }}>
          <div style={{ display:'flex', justifyContent:'space-between', alignItems:'flex-start' }}>
            <div>
              <div style={{ fontWeight:800, fontSize:17, color:'#111827' }}>{isNew ? 'New Group' : 'Edit Group'}</div>
              {group?.number && <div style={{ fontSize:11, color:'#9CA3AF', marginTop:3, fontFamily:'monospace' }}>{group.number}</div>}
            </div>
            <button onClick={onClose} style={{ background:'#F1F5F9', border:'none', color:'#374151', width:30, height:30, borderRadius:8, fontSize:16, display:'flex', alignItems:'center', justifyContent:'center' }}>×</button>
          </div>
          {err && <div style={{ background:'#FEF2F2', color:'#DC2626', padding:'8px 12px', borderRadius:8, fontSize:12, marginTop:14 }}>{err}</div>}
          <div style={{ display:'grid', gridTemplateColumns:'1fr 1fr', gap:14, marginTop:20 }}>
            <div>
              <label style={lStyle}>Group Name *</label>
              <input value={name} onChange={e=>setName(e.target.value)} style={{ ...iStyle, borderColor: err&&!name.trim()?'#EF4444':'#E8EBF0' }} placeholder="e.g. Steel Consolidation 2026"
                onFocus={e=>e.target.style.borderColor=tweaks.accentColor} onBlur={e=>e.target.style.borderColor='#E8EBF0'} />
            </div>
            <div>
              <label style={lStyle}>Owner *</label>
              <input value={owner} onChange={e=>setOwner(e.target.value)} style={{ ...iStyle, borderColor: err&&!owner.trim()?'#EF4444':'#E8EBF0' }} placeholder="e.g. M. Weber"
                onFocus={e=>e.target.style.borderColor=tweaks.accentColor} onBlur={e=>e.target.style.borderColor='#E8EBF0'} />
            </div>
          </div>
        </div>

        {/* Project picker — all filters in one row */}
        <div style={{ padding:'14px 32px', borderBottom:'1px solid #F3F4F6', flexShrink:0, display:'flex', alignItems:'center', gap:8 }}>
          <span style={{ fontSize:11, fontWeight:700, color:'#9CA3AF', textTransform:'uppercase', letterSpacing:'0.07em', flexShrink:0 }}>
            Projects
            <span style={{ color:'#B0B7C3', fontWeight:400, textTransform:'none', marginLeft:6 }}>({selected.length} selected · {filtered.length} shown)</span>
          </span>
          <div style={{ flex:1 }} />
          {/* Search */}
          <div style={{ position:'relative', flexShrink:0 }}>
            <svg style={{ position:'absolute', left:9, top:'50%', transform:'translateY(-50%)', color:'#9CA3AF' }} width="12" height="12" fill="none" viewBox="0 0 15 15">
              <path d="M6.5 11a4.5 4.5 0 100-9 4.5 4.5 0 000 9zm3.89-.61 2.72 2.72" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            </svg>
            <input value={q} onChange={e=>setQ(e.target.value)} placeholder="Search…"
              style={{ ...selSt, paddingLeft:28, width:150 }} />
          </div>
          {/* Commodity */}
          <select value={fCom} onChange={e=>setFCom(e.target.value)} style={{ ...selSt, width:150 }}>
            <option value="all">All Commodities</option>
            {commodities.map(c=><option key={c} value={c}>{c}</option>)}
          </select>
          {/* Owner filter */}
          <select value={fOwnerF} onChange={e=>setFOwnerF(e.target.value)} style={{ ...selSt, width:130 }}>
            <option value="all">All Owners</option>
            {owners.map(o=><option key={o} value={o}>{o}</option>)}
          </select>
          {/* BU */}
          <select value={fBU} onChange={e=>setFBU(e.target.value)} style={{ ...selSt, width:160 }}>
            <option value="all">All BUs</option>
            {bus.map(b=><option key={b} value={b}>{b}</option>)}
          </select>
        </div>

        {/* Scrollable list */}
        <div style={{ flex:1, overflowY:'auto', padding:'8px 32px 16px' }}>
          {filtered.length === 0 && <div style={{ padding:24, textAlign:'center', color:'#B0B7C3', fontSize:12 }}>No projects match your filters</div>}
          {filtered.map(p => {
            const isSelected = selected.includes(p.id);
            return (
              <div key={p.id} onClick={()=>toggle(p.id)} style={{
                display:'flex', alignItems:'center', gap:12, padding:'10px 12px', borderRadius:9, marginBottom:4, cursor:'pointer', transition:'background 0.1s',
                background: isSelected ? tweaks.accentColor+'0D' : '#FAFAFA',
                border: `1px solid ${isSelected ? tweaks.accentColor+'40' : '#F1F5F9'}`,
              }}
                onMouseEnter={e=>{ if(!isSelected) e.currentTarget.style.background='#F4F6FA'; }}
                onMouseLeave={e=>{ if(!isSelected) e.currentTarget.style.background='#FAFAFA'; }}>
                <span style={{ width:17, height:17, borderRadius:5, border:`2px solid ${isSelected ? tweaks.accentColor : '#D1D5DB'}`, background: isSelected ? tweaks.accentColor : '#fff', display:'flex', alignItems:'center', justifyContent:'center', flexShrink:0, transition:'all 0.12s' }}>
                  {isSelected && <svg width="9" height="9" viewBox="0 0 10 10" fill="none"><path d="M2 5l2.5 2.5L8 3" stroke="#fff" strokeWidth="1.8" strokeLinecap="round" strokeLinejoin="round"/></svg>}
                </span>
                <div style={{ flex:1, minWidth:0 }}>
                  <div style={{ fontWeight:600, fontSize:12.5, color:'#111827', whiteSpace:'nowrap', overflow:'hidden', textOverflow:'ellipsis' }}>{p.title}</div>
                  <div style={{ fontSize:11, color:'#9CA3AF', marginTop:2, display:'flex', gap:8 }}>
                    <span>{p.number}</span>
                    <span>·</span>
                    <span>{p.owner}</span>
                    {p.category && <><span>·</span><span>{p.category}</span></>}
                    {p.businessUnit && <><span>·</span><span style={{ color:'#3D6FE8' }}>{p.businessUnit}</span></>}
                  </div>
                </div>
                <div style={{ display:'flex', gap:6, flexShrink:0, alignItems:'center' }}>
                  <Badge status={p.status} />
                  <strong style={{ fontSize:12, color:'#111827' }}>{fmtEur(p.savingsAmount, tweaks.currency)}</strong>
                </div>
              </div>
            );
          })}
        </div>

        {/* Footer */}
        <div style={{ padding:'16px 32px', borderTop:'1px solid #F3F4F6', display:'flex', justifyContent:'flex-end', gap:10 }}>
          <button onClick={onClose} style={{ padding:'9px 20px', border:'1px solid #E8EBF0', borderRadius:9, background:'#fff', fontSize:12, fontWeight:600, color:'#374151' }}>Cancel</button>
          <button onClick={save} style={{ padding:'9px 22px', background:tweaks.accentColor, color:'#fff', border:'none', borderRadius:9, fontSize:12, fontWeight:700 }}>
            {isNew ? 'Create Group' : 'Save Changes'}
          </button>
        </div>
      </div>
    </div>
  );
}

// ── App ──────────────────────────────────────────────────────
function App() {
  const [projects,      setProjects]      = useState(() => { try { const s=localStorage.getItem('sp_p'); return s?JSON.parse(s):SAMPLE_DATA; } catch { return SAMPLE_DATA; } });
  const [groups,        setGroups]        = useState(() => { try { const s=localStorage.getItem('sp_g'); return s?JSON.parse(s):SAMPLE_GROUPS; } catch { return SAMPLE_GROUPS; } });
  const [suppliers,     setSuppliers]     = useState(() => { try { const s=localStorage.getItem('sp_sup'); return s?JSON.parse(s):SAMPLE_SUPPLIERS; } catch { return SAMPLE_SUPPLIERS; } });
  const [priceChanges,  setPriceChanges]  = useState(() => { try { const s=localStorage.getItem('sp_pc'); if(!s) return SAMPLE_PC; const parsed=JSON.parse(s); const hasBadEndDates=parsed.some(p=>p.endDate&&p.endDate.endsWith('-09-30')&&p.startDate&&!p.startDate.startsWith(p.endDate.slice(0,4)-1+'-10')); return hasBadEndDates ? SAMPLE_PC : parsed; } catch { return SAMPLE_PC; } });
  const [view,          setView]          = useState(() => { const v = localStorage.getItem('sp_v'); return (v && v !== 'kanban') ? v : 'list'; });
  const [tweaks,        setTweaks]        = useState(() => { try { const s=localStorage.getItem('sp_t'); return s?{...TWEAK_DEFAULTS,...JSON.parse(s)}:TWEAK_DEFAULTS; } catch { return TWEAK_DEFAULTS; } });
  const [modal,         setModal]         = useState(null);
  const [groupModal,    setGroupModal]    = useState(null); // null | 'new' | group object
  const [tweaksVisible, setTweaksVisible] = useState(false);

  // Current FY = the one whose Oct 1 start has already passed
  const curFY = (() => {
    const today = new Date();
    return today >= new Date(today.getFullYear(), 9, 1)
      ? today.getFullYear() + 1
      : today.getFullYear();
  })();
  const [selectedFY, setSelectedFY] = useState(curFY);

  useEffect(() => { localStorage.setItem('sp_p',   JSON.stringify(projects));     }, [projects]);
  useEffect(() => { localStorage.setItem('sp_g',   JSON.stringify(groups));       }, [groups]);
  useEffect(() => { localStorage.setItem('sp_sup', JSON.stringify(suppliers));    }, [suppliers]);
  useEffect(() => { localStorage.setItem('sp_pc',  JSON.stringify(priceChanges)); }, [priceChanges]);
  useEffect(() => { localStorage.setItem('sp_v', view); }, [view]);
  useEffect(() => {
    localStorage.setItem('sp_t', JSON.stringify(tweaks));
    window.parent.postMessage({ type:'__edit_mode_set_keys', edits: tweaks }, '*');
  }, [tweaks]);

  useEffect(() => {
    const handler = e => {
      if (e.data?.type === '__activate_edit_mode')   setTweaksVisible(true);
      if (e.data?.type === '__deactivate_edit_mode') setTweaksVisible(false);
    };
    window.addEventListener('message', handler);
    window.parent.postMessage({ type:'__edit_mode_available' }, '*');
    return () => window.removeEventListener('message', handler);
  }, []);

  const handleEdit = (id, patch) => {
    if (patch) { setProjects(ps => ps.map(p => p.id===id ? {...p,...patch} : p)); }
    else       { const p = projects.find(x=>x.id===id); if (p) setModal(p); }
  };
  const handleSave = form => {
    setProjects(ps => form.id && ps.some(p=>p.id===form.id) ? ps.map(p=>p.id===form.id?form:p) : [...ps, form]);
    setModal(null);
  };
  const handleDelete = id => { setProjects(ps=>ps.map(p=>p.id===id?{...p,status:'deleted'}:p)); };
  const handleStatusChange = (id, status) => setProjects(ps=>ps.map(p=>p.id===id?{...p,status}:p));

  const nextGroupNum = () => `GP-${String(groups.length + 1).padStart(3,'0')}`;
  const handleSaveGroup = g => {
    setGroups(gs => g.id && gs.some(x=>x.id===g.id) ? gs.map(x=>x.id===g.id?g:x) : [...gs, g]);
    setGroupModal(null);
  };
  const handleDeleteGroup = id => setGroups(gs=>gs.filter(g=>g.id!==id));
  const handleRemoveFromGroup = (groupId, projectId) => {
    setGroups(gs=>gs.map(g=>g.id===groupId ? {...g, projectIds: g.projectIds.filter(id=>id!==projectId)} : g));
  };

  const exportToExcel = () => {
    const wb = XLSX.utils.book_new();
    const cur = tweaks.currency || '€';

    // Tab 1: Dashboard summary
    const activeProjects = projects.filter(p => p.status !== 'deleted');
    const totalSavings = activeProjects.reduce((s, p) => s + Number(p.savingsAmount), 0);
    const byStatus = Object.keys(STATUS).filter(k=>k!=='deleted').map(k => {
      const ps = activeProjects.filter(p => p.status === k);
      return [STATUS[k], ps.length, ps.reduce((s,p)=>s+Number(p.savingsAmount),0)];
    });
    const byCat = CATEGORIES.map(cat => {
      const ps = activeProjects.filter(p => p.category === cat);
      return ps.length ? [cat, ps.length, ps.reduce((s,p)=>s+Number(p.savingsAmount),0)] : null;
    }).filter(Boolean);
    const byBU = BUSINESS_UNITS.map(bu => {
      const ps = activeProjects.filter(p => p.businessUnit === bu);
      return ps.length ? [bu, ps.length, ps.reduce((s,p)=>s+Number(p.savingsAmount),0)] : null;
    }).filter(Boolean);
    const suppMap = new Map();
    activeProjects.forEach(p => { if (p.supplier) suppMap.set(p.supplier, (suppMap.get(p.supplier)||0) + Number(p.savingsAmount)); });
    const topSupp = [...suppMap].sort((a,b)=>b[1]-a[1]).slice(0,10).map(([k,v]) => [k, v, totalSavings ? Math.round(v/totalSavings*1000)/10 : 0]);

    const dashRows = [
      ['DASHBOARD SUMMARY'],
      ['Generated:', new Date().toLocaleDateString('de-DE')],
      [],
      ['Annual Target (' + cur + ')', tweaks.annualTarget],
      ['Total Savings (' + cur + ')', totalSavings],
      ['Achieved (%)', totalSavings ? Math.round(totalSavings / tweaks.annualTarget * 1000) / 10 : 0],
      ['Active Projects', activeProjects.length],
      [],
      ['SAVINGS BY STATUS'],
      ['Status', 'Projects', 'Savings (' + cur + ')'],
      ...byStatus,
      [],
      ['SAVINGS BY COMMODITY'],
      ['Category', 'Projects', 'Savings (' + cur + ')'],
      ...byCat,
      [],
      ['SAVINGS BY BUSINESS UNIT'],
      ['Business Unit', 'Projects', 'Savings (' + cur + ')'],
      ...byBU,
      [],
      ['TOP SUPPLIERS BY SAVINGS'],
      ['Supplier', 'Savings (' + cur + ')', 'Share (%)'],
      ...topSupp,
    ];
    const wsDash = XLSX.utils.aoa_to_sheet(dashRows);
    wsDash['!cols'] = [{ wch: 35 }, { wch: 20 }, { wch: 20 }];
    XLSX.utils.book_append_sheet(wb, wsDash, 'Dashboard');

    // Tab 2: Projects (with Group ID + Supplier No.)
    const projRows = projects.filter(p => p.status !== 'deleted').map(p => {
      const grp = groups.find(g => g.projectIds.includes(p.id));
      const supObj = suppliers.find(s => s.name === p.supplier);
      const row = {
        'No.':             p.number,
        'Group ID':        grp ? grp.number : '',
        'Title':           p.title,
        'Status':          STATUS[p.status] || p.status,
        'Owner':           p.owner,
        'Category':        p.category,
        'Business Unit':   p.businessUnit,
        'Measure Type':    p.measureType,
        'Supplier No.':    supObj ? supObj.number : '',
        'Supplier':        p.supplier,
        'Plant':           p.plant,
        'Start Date':      p.startDate,
        ['Savings (' + cur + ')']: Number(p.savingsAmount),
        'One-Time':        p.oneTimeSaving ? 'Yes' : 'No',
        'Eng. Effort (%)': p.engineeringEffort,
        'Comments':        p.comments,
      };
      return row;
    });
    const wsProj = XLSX.utils.json_to_sheet(projRows);
    wsProj['!cols'] = [
      { wch: 10 }, { wch: 10 }, { wch: 40 }, { wch: 14 }, { wch: 16 },
      { wch: 16 }, { wch: 20 }, { wch: 24 }, { wch: 12 }, { wch: 28 },
      { wch: 8  }, { wch: 12 }, { wch: 16 }, { wch: 10 }, { wch: 16 }, { wch: 50 },
    ];
    XLSX.utils.book_append_sheet(wb, wsProj, 'Projects');

    // Tab 3: Battleplan – one row per supplier, price changes as repeated column groups
    // Group price changes by supplier
    const pcBySup = new Map();
    priceChanges.forEach(pc => {
      if (!pcBySup.has(pc.supplierId)) pcBySup.set(pc.supplierId, []);
      pcBySup.get(pc.supplierId).push(pc);
    });
    // Find max number of price changes across all suppliers
    const maxPc = Math.max(...[...pcBySup.values()].map(arr => arr.length), 0);
    // Build header row
    const bpHeader = ['Supplier No.', 'Supplier Name', 'Commodity', 'Plant', 'Purchaser', 'Vol. 2025', 'Vol. 2026', 'Vol. 2027'];
    for (let i = 1; i <= maxPc; i++) {
      bpHeader.push(i + '# Direction', i + '# Change (%)', i + '# Start Date', i + '# End Date', i + '# Status');
    }
    // Build data rows
    const bpDataRows = suppliers.map(sup => {
      const pcs = pcBySup.get(sup.id) || [];
      const row = [
        sup.number,
        sup.name,
        sup.commodity,
        sup.plant,
        sup.purchaser,
        getVolume(sup, 2025),
        getVolume(sup, 2026),
        getVolume(sup, 2027),
      ];
      for (let i = 0; i < maxPc; i++) {
        const pc = pcs[i];
        if (pc) {
          row.push(
            Number(pc.percent) < 0 ? 'Saving' : 'Increase',
            Number(pc.percent),
            pc.startDate,
            pc.endDate,
            PC_STATUS[pc.status] || pc.status
          );
        } else {
          row.push('', '', '', '', '');
        }
      }
      return row;
    });
    const wsBP = XLSX.utils.aoa_to_sheet([bpHeader, ...bpDataRows]);
    // Column widths: fixed cols + 5 cols per PC group
    const bpCols = [
      { wch: 12 }, { wch: 30 }, { wch: 18 }, { wch: 8 }, { wch: 16 },
      { wch: 14 }, { wch: 14 }, { wch: 14 },
    ];
    for (let i = 0; i < maxPc; i++) {
      bpCols.push({ wch: 12 }, { wch: 14 }, { wch: 13 }, { wch: 13 }, { wch: 18 });
    }
    wsBP['!cols'] = bpCols;
    XLSX.utils.book_append_sheet(wb, wsBP, 'Battleplan');

    XLSX.writeFile(wb, 'Saving_Projects_Export_' + new Date().toISOString().slice(0,10) + '.xlsx');
  };

  return (
    <div style={{ display:'flex', height:'100vh', fontFamily:"'DM Sans', sans-serif", background:'#F4F6FA' }}>
      {/* Sidebar */}
      <div style={{ width:210, background:'#18202F', display:'flex', flexDirection:'column', flexShrink:0 }}>
        <div style={{ padding:'22px 18px 18px', borderBottom:'1px solid rgba(255,255,255,0.07)' }}>
          <div style={{ fontSize:13, fontWeight:800, color:'#fff', letterSpacing:'0.02em', lineHeight:1.3 }}>Saving Projects</div>
          <div style={{ fontSize:10, color:'rgba(255,255,255,0.35)', marginTop:3, fontWeight:500, letterSpacing:'0.05em' }}>PURCHASING · {new Date().getFullYear()}</div>
        </div>
        <nav style={{ padding:'10px 10px', flex:1 }}>
          {NAV.map(v => (
            <button key={v.key} onClick={()=>setView(v.key)} style={{
              display:'flex', alignItems:'center', gap:10, width:'100%', padding:'9px 11px', borderRadius:9, marginBottom:2,
              background: view===v.key ? 'rgba(255,255,255,0.11)' : 'none',
              border:'none', color: view===v.key ? '#fff' : 'rgba(255,255,255,0.42)',
              fontSize:13, fontWeight: view===v.key ? 700 : 400, cursor:'pointer', textAlign:'left', transition:'all 0.12s'
            }}
              onMouseEnter={e=>{ if(view!==v.key) e.currentTarget.style.background='rgba(255,255,255,0.06)'; }}
              onMouseLeave={e=>{ if(view!==v.key) e.currentTarget.style.background='none'; }}>
              <span style={{ opacity: view===v.key ? 1 : 0.6 }}>{v.svg}</span>
              {v.label}
            </button>
          ))}
        </nav>
        <div style={{ borderTop:'1px solid rgba(255,255,255,0.07)', padding:'10px 10px 4px' }}>
          <button onClick={exportToExcel} style={{
            display:'flex', alignItems:'center', gap:8, width:'100%', padding:'9px 11px', borderRadius:9,
            background:'rgba(255,255,255,0.07)', border:'1px solid rgba(255,255,255,0.10)',
            color:'rgba(255,255,255,0.65)', fontSize:12, fontWeight:500, cursor:'pointer', textAlign:'left',
            transition:'all 0.12s',
          }}
            onMouseEnter={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.13)'; e.currentTarget.style.color='#fff'; }}
            onMouseLeave={e=>{ e.currentTarget.style.background='rgba(255,255,255,0.07)'; e.currentTarget.style.color='rgba(255,255,255,0.65)'; }}>
            <svg width="14" height="14" fill="none" viewBox="0 0 14 14" style={{ flexShrink:0 }}>
              <path d="M2 10v2a1 1 0 001 1h8a1 1 0 001-1v-2" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round"/>
              <path d="M7 1v7m0 0L4.5 5.5M7 8l2.5-2.5" stroke="currentColor" strokeWidth="1.4" strokeLinecap="round" strokeLinejoin="round"/>
            </svg>
            Export to Excel
          </button>
        </div>
        <div style={{ padding:'8px 18px 14px', fontSize:10, color:'rgba(255,255,255,0.2)', fontWeight:500, letterSpacing:'0.05em' }}>
          {projects.filter(p=>p.status!=='deleted').length} PROJECTS · {fmtEur(projects.filter(p=>p.status!=='deleted').reduce((s,p)=>s+Number(p.savingsAmount),0), tweaks.currency)} TOTAL
        </div>
      </div>

      {/* Main */}
      <div style={{ flex:1, display:'flex', flexDirection:'column', overflow:'hidden' }}>
        <div style={{ padding:'14px 32px', borderBottom:'1px solid #E8EBF0', background:'#fff', display:'flex', alignItems:'center', justifyContent:'space-between', flexShrink:0 }}>
          <h1 style={{ fontSize:16, fontWeight:800, color:'#111827', letterSpacing:'-0.3px' }}>
            {NAV.find(v=>v.key===view)?.label}
            {(view==='battleplan' || view==='dashboard') && (
              <span style={{ marginLeft:10, fontSize:12, fontWeight:500, color:'#9CA3AF', letterSpacing:0 }}>
                · Fiscal Year {selectedFY}
              </span>
            )}
          </h1>
          <div style={{ display:'flex', alignItems:'center', gap:10 }}>
            {(view === 'battleplan' || view === 'dashboard') && (
              <div style={{ display:'flex', alignItems:'center', gap:6, background:'#F4F6FA', borderRadius:10, padding:'4px 5px' }}>
                {FY_PRESETS.map(p => {
                  const fy = parseInt(p.label.replace('FY ',''));
                  const isActive = fy === selectedFY;
                  return (
                    <button key={p.label} onClick={()=>setSelectedFY(fy)} style={{
                      padding:'5px 14px', borderRadius:7, border:'none', cursor:'pointer', fontSize:12, fontWeight: isActive ? 700 : 500,
                      background: isActive ? '#fff' : 'transparent',
                      color: isActive ? '#111827' : '#9CA3AF',
                      boxShadow: isActive ? '0 1px 4px rgba(0,0,0,0.10)' : 'none',
                      transition:'all 0.15s',
                      position:'relative',
                    }}>
                      {p.label}
                      {fy === curFY && (
                        <span style={{ position:'absolute', top:3, right:4, width:5, height:5, borderRadius:'50%', background:'#3D6FE8' }} />
                      )}
                    </button>
                  );
                })}
              </div>
            )}
            {view === 'list' && (
              <div style={{ fontSize:11, color:'#B0B7C3', fontWeight:500 }}>FY {new Date().getFullYear()}</div>
            )}
          </div>
        </div>
        <div style={{ flex:1, overflow:'hidden', display:'flex', flexDirection:'column' }}>
          {view==='dashboard' && <Dashboard projects={projects} suppliers={suppliers} priceChanges={priceChanges} tweaks={tweaks} selectedFY={selectedFY} />}
          {view==='list'      && <ListView  projects={projects} groups={groups} onEdit={handleEdit} onDelete={handleDelete} onAdd={()=>setModal('new')} onAddGroup={()=>setGroupModal('new')} onEditGroup={g=>setGroupModal(g)} onDeleteGroup={handleDeleteGroup} onRemoveFromGroup={handleRemoveFromGroup} tweaks={tweaks} onStatusChange={handleStatusChange} />}
          {view==='battleplan'&& <BattleplanView suppliers={suppliers} setSuppliers={setSuppliers} priceChanges={priceChanges} setPriceChanges={setPriceChanges} tweaks={tweaks} selectedFY={selectedFY} />}
        </div>
      </div>

      {modal && <ProjectModal project={modal==='new'?null:modal} projects={projects} onSave={handleSave} onClose={()=>setModal(null)} tweaks={tweaks} />}
      {groupModal !== null && <GroupModal group={groupModal==='new'?null:groupModal} groups={groups} projects={projects} onSave={handleSaveGroup} onClose={()=>setGroupModal(null)} tweaks={tweaks} nextNum={nextGroupNum} />}
      <TweaksPanel tweaks={tweaks} setTweaks={setTweaks} visible={tweaksVisible} />
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
